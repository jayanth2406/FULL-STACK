<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="container">
    <h1>To Do List</h1>

    <input type="text" id="task" placeholder="Enter Task">

    <select id="priority">
      <option>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>

    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>

    <h2>Card Component</h2>

    <div class="card">
      <h3>iPhone 15</h3>
      <p>Price: 70000</p>
    </div>

    <div class="card">
      <h3>Jayanth</h3>
      <p>CSE Student</p>
    </div>
  </div>

  <script src="index.js"></script>

</body>
</html>
